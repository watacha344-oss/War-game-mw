<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>師団規模ウォーゲーム</title>
  <meta name="theme-color" content="#1f3b2d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="師団ウォーゲーム">
  <!-- すべて相対パス：GitHub Pages の https://<user>.github.io/<repo>/ 配下でも動く -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="view"></canvas>

  <header id="hud">
    <button id="btnPause">▶ 再開</button>
    <button id="btnSpeed">×1</button>
    <span id="clock">00:00 / 18:00</span>
    <span id="objStatus"></span>
    <span class="spacer"></span>
    <button id="btnLog">戦闘ログ</button>
    <button id="btnMenu">メニュー</button>
  </header>
  <div id="rotate">端末を横向きにすると遊びやすくなります</div>

  <div id="bottom">
    <section id="unitPanel" hidden>
      <div id="unitName"></div>
      <div id="unitMeta"></div>
      <div class="row" id="rFuel"><span>燃料</span><div class="bar"><i></i></div><b></b></div>
      <div class="row" id="rAmmo"><span>弾薬</span><div class="bar"><i></i></div><b></b></div>
      <div class="row" id="rFood"><span>食料</span><div class="bar"><i></i></div><b></b></div>
      <div id="stockLine"></div>
    </section>
    <nav id="cmdBar">
      <button data-mode="advance">進軍</button>
      <button data-mode="attack">攻撃</button>
      <button data-mode="defend">防御</button>
      <button data-mode="hold">待機</button>
      <button id="btnDone">完了</button>
    </nav>
    <nav id="supportBar">
      <button id="btnAir">✈ 航空支援</button>
      <button id="btnPara">🪂 空挺</button>
    </nav>
  </div>

  <aside id="logPanel" hidden>
    <div class="logHead"><span>戦闘ログ</span><button id="btnLogClose">閉じる</button></div>
    <div id="logList"></div>
  </aside>

  <div id="toast" hidden></div>

  <div id="overlay">
    <div class="card">
      <h1 id="ovTitle"></h1>
      <p id="ovBody"></p>
      <div id="ovBtns"></div>
    </div>
  </div>

  <script>
    // Service Worker の登録（オフライン動作用）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (e) { console.error('SW登録失敗', e); });
      });
    }
  </script>
  <script type="module" src="./game.js"></script>
</body>
</html>
